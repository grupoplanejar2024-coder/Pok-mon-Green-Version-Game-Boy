<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokémon: Green Version - Kubo Touch</title>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 15px;
            background: #1e1e1e;
            z-index: 5;
        }

        .badge {
            background: #333333;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid #555;
        }

        #game-card {
            width: 100%;
            max-width: 440px;
            margin: 80px 20px 20px 20px;
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            perspective: 1000px;
        }

        /* Cartucho 3D */
        .cartridge-wrapper {
            width: 100%;
            padding: 25px 10px 15px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            cursor: pointer;
        }

        /* Corpo do cartucho Game Boy Verde */
        .gb-cart-body {
            width: 240px;
            height: 274px;
            position: relative;
            background: linear-gradient(180deg, #22a04b 0%, #146b31 100%);
            border-radius: 8px 6px 6px 6px;
            clip-path: polygon(
                0 0,
                calc(100% - 22px) 0,
                calc(100% - 22px) 16px,
                100% 16px,
                100% 100%,
                0 100%
            );
            box-shadow:
                inset 0 2px 3px rgba(155,245,180,0.45),
                inset 0 -4px 7px rgba(6,42,18,0.52),
                inset 3px 0 4px rgba(140,235,170,0.25),
                inset -3px 0 4px rgba(6,42,18,0.48);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0 10px 0;
            transform: translateZ(20px);
            filter: drop-shadow(0 15px 22px rgba(0,0,0,0.75));
        }

        /* Faixa superior */
        .gb-top-band {
            width: 100%;
            height: 40px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gb-logo-oval {
            width: 100%;
            height: 36px;
            background: linear-gradient(180deg, #187a38 0%, #1e8f43 100%);
            border-radius: 18px;
            box-shadow:
                inset 0 2px 4px rgba(5,36,15,0.55),
                0 1px 1px rgba(160,245,185,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gb-logo-text {
            font-size: 11px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 0.4px;
            color: #0e5224;
            text-shadow:
                0 1px 0 rgba(150,235,175,0.35),
                0 -1px 0 rgba(4,28,12,0.45);
            white-space: nowrap;
        }

        .gb-logo-text small {
            font-style: normal;
            font-size: 7px;
            font-weight: 800;
            margin-left: 2px;
        }

        /* Rebaixo da etiqueta */
        .gb-label-recess {
            width: 184px;
            height: 164px;
            margin-top: 12px;
            padding: 3px;
            background: #105c29;
            border-radius: 6px;
            box-shadow:
                inset 0 2px 4px rgba(5,32,14,0.65),
                0 1px 1px rgba(150,235,175,0.3);
            display: flex;
        }

        .gb-label-sticker {
            width: 100%;
            height: 100%;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            display: flex;
            background: #1b8a40;
            border: 1px solid #072e14;
        }

        /* Capa centralizada */
        .gb-sticker-art {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #1b8a40;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gb-sticker-art img {
            width: 100%;
            height: 100%;
            max-width: 100%;
            object-fit: contain;
            object-position: center;
            transform: none;
            image-rendering: auto;
            filter: contrast(1.04) saturate(1.06);
            backface-visibility: hidden;
            display: block;
        }

        /* Reflexo na etiqueta */
        .gb-label-sticker::after {
            content: '';
            position: absolute;
            top: 0;
            left: -120%;
            width: 65%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.22),
                transparent
            );
            transform: skewX(-25deg);
            transition: left 0.6s ease;
            z-index: 3;
            pointer-events: none;
        }

        .gb-cart-body:hover .gb-label-sticker::after {
            left: 160%;
        }

        /* Triângulo inferior */
        .gb-bottom-triangle {
            margin-top: 8px;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 15px solid #12612c;
            filter: drop-shadow(0 1px 0 rgba(150,235,175,0.3));
        }

        /* Informações */
        .content {
            padding: 20px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 22px;
            color: #e5e5e5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .meta-info {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #aaa;
        }

        .description {
            font-size: 14px;
            line-height: 1.5;
            color: #ddd;
            margin-bottom: 15px;
        }

        .details {
            font-size: 13px;
            color: #bbb;
            margin-bottom: 20px;
        }

        .details ul {
            padding-left: 20px;
            margin: 0;
        }

        /* Botão jogar */
        .btn-play {
            display: block;
            width: 100%;
            padding: 16px;
            background: #2b2b2b;
            color: #fff;
            border: 1px solid #555;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            text-align: center;
            outline: none;
            position: relative;
            z-index: 10;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-play:hover {
            background: #3b3b3b;
            transform: translateY(-2px);
        }

        .btn-play:active {
            background: #1f1f1f;
            transform: translateY(0);
        }

        /* Emulador */
        #game-container {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 99999;
            background: #000;
            overflow: hidden;
        }

        #game {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }

        /* Tela ampliada no celular vertical */
        @media screen and (max-width: 768px) {

            #game-container {
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                background: #000;
                overflow: hidden;
            }

            #game {
                width: 100vw !important;
                height: 100dvh !important;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            #game canvas {
                width: 100vw !important;
                height: auto !important;
                max-width: 100vw !important;
                max-height: 90dvh !important;
                aspect-ratio: 10 / 9;
                object-fit: contain;
                display: block;
            }
        }

        /* Celular horizontal */
        @media screen and (max-width: 768px) and (orientation: landscape) {

            #game-container {
                width: 100vw;
                height: 100dvh;
            }

            #game {
                width: 100vw !important;
                height: 100dvh !important;
            }

            #game canvas {
                width: auto !important;
                height: 100dvh !important;
                max-width: 100vw !important;
                max-height: 100dvh !important;
                aspect-ratio: 10 / 9;
                object-fit: contain;
            }
        }

        /* Telas menores */
        @media (max-width: 400px) {

            .gb-cart-body {
                transform: scale(0.9) translateZ(20px);
            }

            #game-card {
                margin-left: 10px;
                margin-right: 10px;
            }
        }
    </style>
</head>

<body>

    <header id="header-bar">
        <span class="badge">KUBO TOUCH</span>
    </header>

    <div id="game-card">

        <!-- Cartucho Game Boy -->
        <div class="cartridge-wrapper" id="cartridge3d">

            <div class="gb-cart-body">

                <!-- Logotipo -->
                <div class="gb-top-band">
                    <div class="gb-logo-oval">
                        <span class="gb-logo-text">
                            Nintendo GAME BOY<small>TM</small>
                        </span>
                    </div>
                </div>

                <!-- Etiqueta do cartucho -->
                <div class="gb-label-recess">
                    <div class="gb-label-sticker">
                        <div class="gb-sticker-art">
                            <img
                                src="pokemon_green_version_game_boy_hq_box_art_clean_by_jadelune_d9tkv29-pre.jpg"
                                alt="Capa Pokémon Green Version"
                            >
                        </div>
                    </div>
                </div>

                <!-- Detalhe inferior -->
                <div class="gb-bottom-triangle"></div>

            </div>
        </div>

        <!-- Informações do jogo -->
        <div class="content">

            <h1>Pokémon: Green Version</h1>

            <div class="meta-info">
                <span>🎮 1 Jogador</span>
                <span>📅 1996</span>
                <span>🕹️ Nintendo (GB)</span>
            </div>

            <p class="description">
                Começa a tua jornada pela região de Kanto escolhendo entre
                Bulbasaur, Charmander ou Squirtle, desafia os oito ginásios
                e enfrenta a Liga Pokémon para te tornares Campeão.
            </p>

            <div class="details">
                <ul>
                    <li><strong>🕹️ Género:</strong> RPG / Aventura</li>
                </ul>
            </div>

            <button id="play-btn" class="btn-play">
                JOGAR AGORA
            </button>

        </div>
    </div>

    <!-- Tela do jogo -->
    <div id="game-container">
        <div id="game"></div>
    </div>

    <script>
        /* Efeito 3D do cartucho */
        const card = document.getElementById('game-card');
        const cartridge = document.getElementById('cartridge3d');

        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();

            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;

            const rotateX = (-y / 14).toFixed(2);
            const rotateY = (x / 14).toFixed(2);

            cartridge.style.transform =
                `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.03)`;
        });

        card.addEventListener('mouseleave', () => {
            cartridge.style.transform =
                `rotateX(0deg) rotateY(0deg) scale(1)`;

            cartridge.style.transition = 'transform 0.5s ease';
        });

        card.addEventListener('mouseenter', () => {
            cartridge.style.transition = 'none';
        });

        /* Inicialização EmulatorJS */
        document.getElementById('play-btn').addEventListener('click', function() {

            document.getElementById('header-bar').style.display = 'none';
            document.getElementById('game-card').style.display = 'none';

            const container = document.getElementById('game-container');
            container.style.display = 'block';

            window.EJS_player = '#game';
            window.EJS_core = 'gb';
            window.EJS_gameName = 'Pokemon - Green Version';
            window.EJS_color = '#1b8a40';
            window.EJS_colorization = true;
            window.EJS_startOnLoaded = true;
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

            window.EJS_gameUrl =
                'Pokemon%20-%20Green%20Version%20%28USA%2C%20Europe%29%20%28SGB%20Enhanced%29%20%5BT-En%20by%20Skeetendo%20Inc.%20v3.0%5D%20%5Bn%5D.gb';

            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            script.async = true;

            document.body.appendChild(script);
        });
    </script>

</body>
</html>
